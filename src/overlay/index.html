<!doctype html>
<html>
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="frame">
    <!-- Drag bar: -webkit-app-region:drag lets the frameless window be moved -->
    <div id="dragbar"><span id="status">▶</span><span class="hint">גררו להזזה · drag to move</span></div>
    <div id="viewport">
      <div id="readline"></div>
      <div id="text"></div>
    </div>
    <div id="grip" title="resize"></div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
